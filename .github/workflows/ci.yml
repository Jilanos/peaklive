name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The Windows job includes packaging. A finite upper bound protects the
    # hosted-runner queue if PyInstaller or an external scan becomes stuck.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - run: uv python install 3.13
      - run: uv sync --all-extras --python 3.13
      - run: uv run ruff check .
      - run: uv run python -m pytest
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipValidation
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PeakLive-windows-x64
          # The evidence file ships with the executable: it carries the build
          # identifier and the SHA-256, which is what ties an operator's
          # observation back to one specific binary.
          path: |
            dist/PeakLive.exe
            dist/PeakLive.build.txt
          if-no-files-found: error
