name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Each Windows shard runs its Qt modules in fresh interpreters, then the
    # first shard packages the executable.  The finite bound catches a true
    # native stall without cancelling a healthy shard mid-suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: all
          - os: windows-latest
            shard: 0
          - os: windows-latest
            shard: 1
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install --yes -o Acquire::Retries=3 libegl1
      - run: uv python install 3.13
      - run: uv sync --all-extras --python 3.13
      - run: uv run ruff check .
      # Qt's native teardown can retain state across test modules on Windows
      # (run 34867528670).  A fresh interpreter per module avoids that
      # cross-module deadlock while retaining the complete test suite.
      - name: Run tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run-ci-tests.ps1 -Shard ${{ matrix.shard }} -ShardCount 2
      - name: Run tests
        if: runner.os != 'Windows'
        run: uv run python -m pytest -vv -ra --junitxml=test-results.xml -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results*.xml
          if-no-files-found: warn
      - name: Build Windows executable
        if: runner.os == 'Windows' && matrix.shard == 0
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipValidation
      - name: Upload Windows executable
        if: runner.os == 'Windows' && matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: PeakLive-windows-x64
          # The evidence file ships with the executable: it carries the build
          # identifier and the SHA-256, which is what ties an operator's
          # observation back to one specific binary.
          path: |
            dist/PeakLive.exe
            dist/PeakLive.build.txt
          if-no-files-found: error
